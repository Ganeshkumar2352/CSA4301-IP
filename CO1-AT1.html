<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        body {
            background-color: lightblue;
            font-family: Cambria, serif;
            font-size: 14px;
            margin: 20px;
            text-align: center;
        }
        h1 {
            color: darkblue;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .grid-item {
            background-color: white;
            border: 2px solid blue;
            padding: 10px;
            text-align: center;
            overflow: hidden;
            height: 120px;
        }
        .scroll-text {
            color: blue;
            white-space: nowrap;
            animation: scrollText 8s linear infinite;
        }
        @keyframes scrollText {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
        .scroll-image {
            width: 80px;
            animation: scrollImage 6s linear infinite;
        }
        @keyframes scrollImage {
            from { transform: translateY(100%); }
            to { transform: translateY(-100%); }
        }
        button {
            background-color: blue;
            color: white;
            font-family: Cambria, serif;
            font-size: 14px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Website</h1>
    <div class="grid-container">
        <div class="grid-item">
            <div class="scroll-text">This is scrolling text in blue...</div>
        </div>
        <div class="grid-item">
            <img src="https://via.placeholder.com/80x80.png?text=Image" class="scroll-image" alt="Scrolling Image">
        </div>
    </div>
    <button>Click Me</button>
</body>
</html>
